
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRAS THE TWELFTH PLAYER</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f3f4;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.container {
    width: 100%;
    max-width: 850px;
    height: 90vh;
    background: white;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 12px #00000015;
}

/* HEADER */
.header {
    padding: 17px 22px;
    display: flex;
    align-items: center;
    gap: 15px;
    border-bottom: 1px solid #eee;
}

.logo {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
}

.header-info h2 {
    font-size: 17px;
    color: #202124;
    letter-spacing: .5px;
}

.header-info p {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

/* CHAT */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.date {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin: 5px 0;
}

.message {
    display: flex;
    align-items: flex-start;
    gap: 11px;
}

.avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #dce4ec;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #44576a;
    flex-shrink: 0;
    font-size: 13px;
}

.content {
    max-width: 85%;
}

.name {
    font-size: 12px;
    color: #777;
    margin-bottom: 5px;
}

.bubble {
    background: #f1f3f4;
    padding: 11px 14px;
    border-radius: 4px 14px 14px 14px;
    color: #202124;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.time {
    color: #999;
    font-size: 10px;
    margin-top: 5px;
}

/* FOOTER */
.footer {
    border-top: 1px solid #eee;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #777;
    font-size: 12px;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #34a853;
}

.chat::-webkit-scrollbar {
    width: 6px;
}

.chat::-webkit-scrollbar-thumb {
    background: #ddd;
    border-radius: 10px;
}

@media(max-width: 600px) {
    .container {
        height: 95vh;
    }

    .header-info h2 {
        font-size: 14px;
    }

    .chat {
        padding: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="image.png" class="logo">

        <div class="header-info">
            <h2>ULTRAS THE TWELFTH PLAYER</h2>
            <p>1,450 members</p>
        </div>
    </div>

    <div class="chat" id="chat">

        <div class="date">TODAY</div>

    </div>

    <div class="footer">
        <div class="status">
            <span class="dot"></span>
            Group simulation
        </div>
        <span>1,450 members</span>
    </div>

</div>

<script>

const names = [
    "Youba", "Amine", "Mohamed", "Yacine",
    "Islam", "Anis", "Walid", "Bilal",
    "Khaled", "Rayan", "Adel", "Sofiane",
    "Ilyes", "Samir", "Omar", "Nassim",
    "Abdou", "Fares", "Hichem", "Reda"
];

const messages = [
    "Dima ULTRAS THE TWELFTH PLAYER 💚",
    "Always behind our team.",
    "The twelfth player is always present!",
    "One group, one family.",
    "Respect to everyone 💚",
    "Ultras forever.",
    "Nobody can separate us.",
    "Together until the end.",
    "Green is our identity 💚",
    "See you at the stadium!",
    "Dima UTTP 🔥",
    "Our passion never dies.",
    "We stand together.",
    "The voice of the terraces!",
    "One love, one passion."
];

const chat = document.getElementById("chat");

function randomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function addMessage(name, message, time) {
    const item = document.createElement("div");
    item.className = "message";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = name.charAt(0).toUpperCase();

    const content = document.createElement("div");
    content.className = "content";

    const username = document.createElement("div");
    username.className = "name";
    username.textContent = name;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = message;

    const timestamp = document.createElement("div");
    timestamp.className = "time";
    timestamp.textContent = time;

    content.append(username, bubble, timestamp);
    item.append(avatar, content);

    chat.appendChild(item);
}

// Create simulated chat messages
for (let i = 0; i < 35; i++) {
    const hour = String(8 + Math.floor(i / 5)).padStart(2, "0");
    const minute = String(Math.floor(Math.random() * 60)).padStart(2, "0");

    addMessage(
        randomItem(names),
        randomItem(messages),
        hour + ":" + minute
    );
}

// Start at the latest message
chat.scrollTop = chat.scrollHeight;

</script>

</body>
</html>
